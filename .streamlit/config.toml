[theme]
primaryColor = "#7c3aed"
backgroundColor = "#f5f3ff"
secondaryBackgroundColor = "#eef2ff"
textColor = "#1e293b"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "developer"

[logger]
level = "info"

[ui]
hideTopBar = false
hideFooterMenu = false

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
port = 8501
headless = false
enableXsrfProtection = true
maxUploadSize = 200