on:
  push:
    branches: [main, second-comp, develop, chore/production-hardening]
  pull_request:
    branches: [main, second-comp, chore/production-hardening]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: medibook

jobs:
  # ─────────────────────────────────────────────────
  # JOB 1: Lint + Format checks
  # ─────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      
      - name: Install lint tools
        run: pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run isort
        run: isort --check-only --diff .

  # ─────────────────────────────────────────────────
  # JOB 2: Security scan
  # ─────────────────────────────────────────────────
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run Bandit (SAST)
        run: bandit -r . -x ./tests,./venv --severity-level medium -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Audit dependencies for vulnerabilities
        run: pip-audit -r requirements.txt --format json -o pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: Check for secrets in code (detect-secrets)
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --exclude-files '*.lock' > .secrets.baseline || true
          echo "Secret scan complete. Review .secrets.baseline if flagged."

  # ─────────────────────────────────────────────────
  # JOB 3: Unit + Integration Tests
  # ─────────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: medibook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test env vars — no real API keys needed for unit tests
      LLM_ENABLED: "false"
      LLM_PROVIDER: "none"
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/medibook_test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: medibook_test
      DB_USER: testuser
      DB_PASSWORD: testpass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov pytest-mock

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Generate coverage report
        run: |
          pytest tests/ --cov=. \
            --cov-omit="tests/*,venv/*,*.egg-info/*" \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────
  # JOB 4: Docker Build
  # ─────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push on PR)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs
        run: |
          docker run --rm \
            -e LLM_ENABLED=false \
            -e LLM_PROVIDER=none \
            ${{ env.IMAGE_NAME }}:ci-${{ github.sha }} \
            python -c "import agents.graph; print('Import OK')"

  # ─────────────────────────────────────────────────
  # JOB 5: Deploy to Render (main branch only)
  # ─────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
