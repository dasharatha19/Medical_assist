name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[FEAT] <short description>"
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - AI/LLM Improvement
        - New Agent Node
        - UI/UX
        - Performance
        - Security
        - Observability
        - MCP Integration
        - Testing
        - Documentation
        - DevOps/CI-CD
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
